<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 4.4 - some / any / a lot of</title>
<style>
  :root{
    --terracotta:#c1633f;
    --terracotta-dark:#8f4527;
    --olive:#7c8a4f;
    --olive-dark:#57612f;
    --base:#faf3ea;
    --panel:#fffdfa;
    --dark:#3a2c22;
    --good:#4a7a2e;
    --bad:#b3402e;
  }
  * { box-sizing: border-box; }
  body{ font-family: Georgia, 'Times New Roman', serif; background: var(--base); margin:0; padding:24px; color: var(--dark); }
  .card{ max-width: 980px; margin: 0 auto; background: var(--panel); border-radius: 14px; overflow: hidden; box-shadow: 0 4px 18px rgba(140,80,40,0.14); }
  .header{ background: linear-gradient(120deg, var(--terracotta) 0%, var(--terracotta-dark) 100%); color: #fff; padding: 20px 26px; display:flex; align-items:baseline; gap:12px; }
  .header .unit-badge{ background: var(--olive); color:#f6f7ec; padding: 4px 12px; border-radius: 20px; font-weight:bold; font-size: 0.85em; letter-spacing: 0.03em; }
  .header h1{ font-size: 1.35em; margin:0; font-weight: normal; }
  .subheader{ background: var(--olive); color:#f6f7ec; padding: 10px 26px; font-size: 1em; font-weight: bold; }
  .body{ padding: 26px; }
  .note{ font-size: 0.92em; color:#7a6a5b; font-style: italic; margin-bottom: 20px; }
  .content-columns{ display:flex; gap: 28px; align-items:flex-start; }
  .picture-col{ flex: 0 0 280px; position: sticky; top: 20px; }
  .picture-col img{ width:100%; border-radius: 10px; border: 3px solid var(--terracotta); box-shadow: 0 3px 12px rgba(140,80,40,0.22); display:block; }
  .picture-caption{ font-size: 0.82em; color:#7a6a5b; font-style: italic; margin-top: 8px; text-align:center; }
  .items-col{ flex: 1; min-width: 0; }
  .item{ margin-bottom: 14px; padding: 12px 14px; border-radius: 8px; background: #fbf5ee; border: 1px solid #ecdcc6; }
  .item.example{ background: #f1ede6; border-color: #ded4c4; }
  .item-top{ display:flex; gap:10px; align-items:baseline; margin-bottom:6px; }
  .num{ font-weight:bold; color: var(--terracotta-dark); min-width: 20px; }
  .line{ margin: 6px 0; line-height: 2.1; }
  .quote{ color:#333; }
  input[type=text]{ width: 90px; padding: 5px 6px; font-family: Georgia, serif; font-size: 1em; border: 1px solid #dcc2a4; border-radius: 5px; background: #fff; text-align:center; }
  input[type=text]:focus{ outline: none; border-color: var(--terracotta); box-shadow: 0 0 0 2px rgba(193,99,63,0.18); }
  input[type=text]:disabled{ background:#eee; color:#555; font-style: italic; border-color:#ccc; width:auto; padding:5px 10px; }
  .feedback{ margin-top: 8px; font-size: 0.92em; display:none; }
  .feedback.show{ display:block; }
  .feedback.good{ color: var(--good); }
  .feedback.warn{ color: var(--bad); }
  #check-btn, #reset-btn, #email-btn{ font-family: Georgia, serif; font-size: 1em; padding: 10px 22px; border-radius: 7px; border: none; cursor: pointer; margin-top: 14px; display: inline-block; text-decoration: none; }
  #check-btn{ background: var(--terracotta); color: #fff; }
  #check-btn:hover{ background: var(--terracotta-dark); }
  #reset-btn{ background: #efe6da; color: var(--dark); margin-left: 10px; }
  #reset-btn:hover{ background:#e3d5c2; }
  #email-btn{ background: var(--olive); color: #f6f7ec; margin-left: 10px; }
  #email-btn:hover{ background: var(--olive-dark); }
  #score-panel{ display:none; margin-top: 20px; padding: 16px; background: #f3efe2; border: 1px solid var(--olive); border-radius: 10px; text-align:center; }
  #score-panel.show{ display:block; }
  #score-text{ font-size: 1.3em; font-weight:bold; color: var(--terracotta-dark); }
  #score-sub{ font-size: 0.85em; color: #7a6a5b; margin-top: 4px; }
  @media (max-width: 720px){
    .content-columns{ flex-direction: column; }
    .picture-col{ flex: none; width: 100%; position: static; max-width: 320px; margin: 0 auto 10px; }
  }
</style>
</head>

        <div class="picture-caption">Deborah's new kitchen</div>
      </div>
      <div class="items-col">
        <div id="items"></div>
      </div>
    </div>

    <button id="check-btn" onclick="checkAnswers()">Check</button>
    <button id="reset-btn" onclick="resetAll()">Reset</button>
    <a id="email-btn" href="mailto:" onclick="return prepareMailto(this)">Send by email</a>
    <div id="score-panel">
      <div id="score-text"></div>
      <div id="score-sub"></div>
    </div>
  </div>
</div>

<script>
// Each item has one or more lines; each line is an array of segments,
// where a segment is either {text: "..."} or {blank: true, answer: "..."}
const data = [
  {
    example: true,
    lines: [
      [{text:"'Deborah has "},{blank:true, answer:"a lot of"},{text:" flowers.'"}],
      [{text:"'Yes, she does, but does she have "},{blank:true, answer:"any"},{text:" vases?'"}]
    ]
  },
  {
    lines: [
      [{text:"'Oh dear, there isn't "},{blank:true, answer:"any"},{text:" coffee left.'"}],
      [{text:"'It's OK, there's "},{blank:true, answer:"some"},{text:" champagne on the table.'"}]
    ]
  },
  {
    lines: [
      [{text:"'Are there "},{blank:true, answer:"any"},{text:" glasses?'"}],
      [{text:"'No, there aren't "},{blank:true, answer:"any"},{text:" glasses, but there are "},{blank:true, answer:"some"},{text:" mugs on the shelf.'"}]
    ]
  },
  {
    lines: [
      [{text:"'Does she have "},{blank:true, answer:"any"},{text:" plates?'"}],
      [{text:"'Yes, she does. There are "},{blank:true, answer:"some"},{text:" in the cupboard.'"}]
    ]
  },
  {
    lines: [
      [{text:"'Does she have "},{blank:true, answer:"any"},{text:" cookbooks?'"}],
      [{text:"'She has "},{blank:true, answer:"some"},{text:" but not many.'"}]
    ]
  },
  {
    lines: [
      [{text:"'Is there "},{blank:true, answer:"any"},{text:" fruit?'"}],
      [{text:"'Yes, there's "},{blank:true, answer:"some"},{text:" fruit - apples, pears, oranges and bananas.'"}]
    ]
  },
  {
    lines: [
      [{text:"'Are there "},{blank:true, answer:"any"},{text:" vegetables?'"}],
      [{text:"'No, there aren't "},{blank:true, answer:"any"},{text:" vegetables.'"}]
    ]
  },
  {
    lines: [
      [{text:"'Are there "},{blank:true, answer:"any"},{text:" pictures?'"}],
      [{text:"'No, there aren't, but there are "},{blank:true, answer:"some"},{text:" lovely photos.'"}]
    ]
  }
];

const itemsDiv = document.getElementById("items");
let blankCounter = 0;
const blankRegistry = []; // {id, answer}

data.forEach((item, i) => {
  const num = i + 1;
  const div = document.createElement("div");
  div.className = "item" + (item.example ? " example" : "");

  const topRow = document.createElement("div");
  topRow.className = "item-top";
  topRow.innerHTML = `<div class="num">${num}</div>`;
  div.appendChild(topRow);

  item.lines.forEach(line => {
    const lineDiv = document.createElement("div");
    lineDiv.className = "line";
    line.forEach(seg => {
      if (seg.text) {
        const span = document.createElement("span");
        span.className = "quote";
        span.textContent = seg.text;
        lineDiv.appendChild(span);
      } else if (seg.blank) {
        blankCounter++;
        const id = `blank-${blankCounter}`;
        blankRegistry.push({ id, answer: seg.answer, example: !!item.example });
        const input = document.createElement("input");
        input.type = "text";
        input.id = id;
        if (item.example) {
          input.value = seg.answer;
          input.disabled = true;
        } else {
          input.placeholder = "...";
        }
        lineDiv.appendChild(input);
      }
    });
    div.appendChild(lineDiv);
  });

  if (!item.example) {
    const feedback = document.createElement("div");
    feedback.className = "feedback";
    feedback.id = `feedback-${num}`;
    div.appendChild(feedback);
  }

  itemsDiv.appendChild(div);
});

function normalize(s){
  return s.trim().toLowerCase().replace(/\s+/g, " ");
}

let lastResults = null; // cache for email: {itemNum: {allCorrect, blanks:[{value, correct, expected}]}}

function checkAnswers() {
  let totalItems = 0;
  let correctItems = 0;
  const results = {};

  data.forEach((item, i) => {
    if (item.example) return;
    const num = i + 1;
    totalItems++;

    const blanksForItem = [];
    item.lines.forEach(line => {
      line.forEach(seg => {
        if (seg.blank) blanksForItem.push(seg);
      });
    });

    let running = 0;
    for (let j = 0; j < i; j++) {
      data[j].lines.forEach(line => line.forEach(seg => { if (seg.blank) running++; }));
    }

    let allCorrect = true;
    const blankDetails = [];
    const itemBlankCount = blanksForItem.length;
    for (let k = 0; k < itemBlankCount; k++) {
      const reg = blankRegistry[running + k];
      const input = document.getElementById(reg.id);
      const value = input.value;
      const isCorrect = normalize(value) === normalize(reg.answer);
      if (!isCorrect) allCorrect = false;
      blankDetails.push({ value: value.trim(), correct: isCorrect, expected: reg.answer });
      input.style.borderColor = value.trim() === "" ? "#dcc2a4" : (isCorrect ? "#4a7a2e" : "#b3402e");
    }

    if (allCorrect) correctItems++;
    results[num] = { allCorrect, blanks: blankDetails };

    const feedback = document.getElementById(`feedback-${num}`);
    feedback.classList.add("show");
    const anyBlank = blankDetails.some(b => b.value === "");
    if (anyBlank) {
      feedback.className = "feedback show warn";
      feedback.textContent = "✗ Please fill in all the blanks.";
    } else if (allCorrect) {
      feedback.className = "feedback show good";
      feedback.textContent = "✓ Correct!";
    } else {
      const correctAnswers = blankDetails.map(b => b.expected).join(" / ");
      feedback.className = "feedback show warn";
      feedback.textContent = `✗ Not quite. Correct answer${blankDetails.length > 1 ? "s" : ""}: ${correctAnswers}`;
    }
  });

  lastResults = results;
  renderScore(correctItems, totalItems);
}

function renderScore(correctCount, total) {
  const scorePanel = document.getElementById("score-panel");
  const scoreText = document.getElementById("score-text");
  const scoreSub = document.getElementById("score-sub");
  scorePanel.classList.add("show");
  scoreText.textContent = `${correctCount} / ${total} correct`;
  scoreSub.textContent = "some, any, or a lot of";
  scorePanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function resetAll() {
  blankRegistry.forEach(reg => {
    if (reg.example) return;
    const input = document.getElementById(reg.id);
    input.value = "";
    input.style.borderColor = "#dcc2a4";
  });
  data.forEach((item, i) => {
    if (item.example) return;
    const num = i + 1;
    const feedback = document.getElementById(`feedback-${num}`);
    feedback.classList.remove("show");
  });
  document.getElementById("score-panel").classList.remove("show");
  lastResults = null;
}

function sentenceForItem(item) {
  return item.lines.map(line => line.map(seg => seg.text ? seg.text : `___`).join("")).join(" ");
}

function prepareMailto(linkEl) {
  let scoreLine = "Not checked yet";
  let detailLines = [];
  const hasChecked = lastResults !== null;
  let correctCount = 0, total = 0;

  data.forEach((item, i) => {
    if (item.example) return;
    total++;
    const num = i + 1;
    const promptText = sentenceForItem(item);

    const blanksForItem = [];
    item.lines.forEach(line => line.forEach(seg => { if (seg.blank) blanksForItem.push(seg); }));

    let running = 0;
    for (let j = 0; j < i; j++) {
      data[j].lines.forEach(line => line.forEach(seg => { if (seg.blank) running++; }));
    }
    const values = [];
    for (let k = 0; k < blanksForItem.length; k++) {
      const reg = blankRegistry[running + k];
      const input = document.getElementById(reg.id);
      values.push(input.value.trim() || "(blank)");
    }
    const yourAnswer = values.join(" / ");

    if (hasChecked) {
      const r = lastResults[num];
      if (r.allCorrect) correctCount++;
      const status = r.allCorrect ? "Correct" : `Incorrect - correct answer: ${r.blanks.map(b => b.expected).join(" / ")}`;
      detailLines.push(`${num}. ${promptText}\n   Your answer: ${yourAnswer}\n   Status: ${status}`);
    } else {
      detailLines.push(`${num}. ${promptText}\n   Your answer: ${yourAnswer}`);
    }
  });

  if (hasChecked) scoreLine = `${correctCount} / ${total} correct`;

  const body = `Hello!

Here are my results for the exercise:

FINAL SCORE: ${scoreLine}

DETAILED ANSWERS:
${detailLines.join("\n\n")}

Regards,`;

  // Set the real href right before the browser follows this same click.
  // Because this runs inside the link's own onclick, the navigation that
  // follows is still a genuine, user-initiated click on a real mailto
  // link - not a script-simulated one - which is what browsers require
  // for mailto links to open reliably.
  linkEl.href = `mailto:?subject=${encodeURIComponent("Exercise 4.4 Results - some/any/a lot of")}&body=${encodeURIComponent(body)}`;
  return true;
}
</script>

</body>
</html>
